services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printvault-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://printvault:vaultpass123@db:5432/printvault?schema=public
      - JWT_SECRET=change_me_to_a_strong_random_secret_in_production #gere com "openssl rand -hex 64"
      - ADMIN_EMAIL=admin@printvault.local
      - ADMIN_PASSWORD=admin123
      - STORAGE_DATA_PATH=/data
      - STORAGE_LIBRARIES_PATH=/libraries
      - APP_VERSION=v1.2.0
      - NEXT_PUBLIC_APP_VERSION=v1.2.0
    volumes:
      # Armazenamento de thumbnails extraídas e uploads
      - ./data:/data
      # Montagem dos diretórios de arquivos 3D (compartilhamentos locais, NFS ou CIFS)
      - ./libraries:/libraries
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: printvault-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=printvault
      - POSTGRES_PASSWORD=vaultpass123
      - POSTGRES_DB=printvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U printvault -d printvault" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: qg
    external: true
